
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Drogas</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f1115;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:100%;
    max-width:700px;
    background:#171a21;
    border-radius:20px;
    padding:30px;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

h1{
    text-align:center;
    margin-bottom:25px;
    font-size:32px;
}

.card{
    background:#1f2430;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

.card h2{
    margin-bottom:15px;
    color:#7c9cff;
}

label{
    display:block;
    margin-bottom:8px;
    margin-top:15px;
}

input, select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2b3242;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#4e7cff;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:scale(1.02);
    background:#6990ff;
}

.resultado{
    margin-top:20px;
    background:#11151d;
    padding:20px;
    border-radius:12px;
    font-size:18px;
    line-height:1.8;
}

.valor{
    color:#74ff9f;
    font-weight:bold;
}

@media(max-width:600px){
    h1{
        font-size:25px;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>💰 Calculadora Drogas</h1>

    <div class="card">
        <h2>Calcular Valor</h2>

        <label>Tipo de Cliente</label>
        <select id="cliente1">
            <option value="aliado">Aliado</option>
            <option value="membro">Membro</option>
            <option value="geral">Geral</option>
        </select>

        <label>Tipo de Dinheiro</label>
        <select id="dinheiro1">
            <option value="limpo">Limpo</option>
            <option value="sujo">Sujo</option>
        </select>

        <label>Quantidade</label>
        <input type="number" id="quantidade" placeholder="Ex: 50">

        <button onclick="calcularValor()">Calcular</button>

        <div class="resultado" id="resultadoValor"></div>
    </div>

    <div class="card">
        <h2>Calcular Quantidade</h2>

        <label>Tipo de Cliente</label>
        <select id="cliente2">
            <option value="aliado">Aliado</option>
            <option value="membro">Membro</option>
            <option value="geral">Geral</option>
        </select>

        <label>Tipo de Dinheiro</label>
        <select id="dinheiro2">
            <option value="limpo">Limpo</option>
            <option value="sujo">Sujo</option>
        </select>

        <label>Quanto dinheiro a pessoa tem?</label>
        <input type="number" id="dinheiroQuantidade" placeholder="Ex: 10000">

        <button onclick="calcularQuantidade()">Calcular</button>

        <div class="resultado" id="resultadoQuantidade"></div>
    </div>

</div>

<script>
const tabela = {
    aliado: {
        limpo: 140,
        sujo: 230
    },
    membro: {
        limpo: 100,
        sujo: 200
    },
    geral: {
        limpo: 170,
        sujo: 270
    }
};

function pegarPreco(cliente, dinheiro){
    return tabela[cliente][dinheiro];
}

function calcularValor(){
    const cliente = document.getElementById('cliente1').value;
    const dinheiro = document.getElementById('dinheiro1').value;
    const quantidade = Number(document.getElementById('quantidade').value);

    const preco = pegarPreco(cliente, dinheiro);
    const total = preco * quantidade;

    document.getElementById('resultadoValor').innerHTML = `
        💵 Valor por unidade: <span class="valor">$${preco}</span><br>
        📦 Quantidade: <span class="valor">${quantidade}</span><br>
        💰 Total: <span class="valor">$${total}</span>
    `;
}

function calcularQuantidade(){
    const cliente = document.getElementById('cliente2').value;
    const dinheiro = document.getElementById('dinheiro2').value;
    const valor = Number(document.getElementById('dinheiroQuantidade').value);

    const preco = pegarPreco(cliente, dinheiro);
    const quantidade = Math.floor(valor / preco);
    const sobra = valor % preco;

    document.getElementById('resultadoQuantidade').innerHTML = `
        💵 Valor por unidade: <span class="valor">$${preco}</span><br>
        📦 Quantidade possível: <span class="valor">${quantidade}</span><br>
        🪙 Dinheiro restante: <span class="valor">$${sobra}</span>
    `;
}
</script>

</body>
</html>
